services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: switchboard
      POSTGRES_PASSWORD: switchboard
      POSTGRES_DB: switchboard
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U switchboard"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
      build:
        context: .
        dockerfile: deploy/Dockerfile
      command: ["alembic", "upgrade", "head"]
      environment:
        SB_DATABASE_URL: postgresql+asyncpg://switchboard:switchboard@postgres:5432/switchboard
      depends_on:
        postgres: {condition: service_healthy}

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    environment:
      SB_DATABASE_URL: postgresql+asyncpg://switchboard:switchboard@postgres:5432/switchboard
      SB_REDIS_URL: redis://redis:6379/0
      SB_OPENAI_API_KEY: ${SB_OPENAI_API_KEY:-}
      SB_OPENAI_BASE_URL: ${SB_OPENAI_BASE_URL:-https://api.openai.com/v1}
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}